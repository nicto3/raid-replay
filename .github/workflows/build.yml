name: Build RaidReplay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check .NET SDK
        shell: pwsh
        run: dotnet --info

      - name: Download EFT 0.16.9 compile references
        shell: pwsh
        run: |
          $managed = Join-Path $env:RUNNER_TEMP 'RaidReplay-SptRefs\EscapeFromTarkov_Data\Managed'
          New-Item -ItemType Directory -Force -Path $managed | Out-Null
          $base = 'https://raw.githubusercontent.com/project-fika/Fika-Plugin/v2.4.3/References'
          Invoke-WebRequest "$base/hollowed.dll" -OutFile (Join-Path $managed 'Assembly-CSharp.dll')
          Invoke-WebRequest "$base/Comfort.dll" -OutFile (Join-Path $managed 'Comfort.dll')
          Invoke-WebRequest "$base/Sirenix.Serialization.dll" -OutFile (Join-Path $managed 'Sirenix.Serialization.dll')
          Invoke-WebRequest "$base/UnityEngine.UI.dll" -OutFile (Join-Path $managed 'UnityEngine.UI.dll')
          Invoke-WebRequest "$base/UnityEngine.dll" -OutFile (Join-Path $managed 'UnityEngine.dll')
          if ((Get-Item (Join-Path $managed 'Assembly-CSharp.dll')).Length -ne 8696320) { throw 'Unexpected Assembly-CSharp reference size' }
          if ((Get-Item (Join-Path $managed 'Comfort.dll')).Length -ne 30264) { throw 'Unexpected Comfort reference size' }
          if ((Get-Item (Join-Path $managed 'Sirenix.Serialization.dll')).Length -ne 114688) { throw 'Unexpected Sirenix.Serialization reference size' }
          if ((Get-Item (Join-Path $managed 'UnityEngine.UI.dll')).Length -ne 264704) { throw 'Unexpected UnityEngine.UI reference size' }
          if ((Get-Item (Join-Path $managed 'UnityEngine.dll')).Length -ne 125120) { throw 'Unexpected UnityEngine reference size' }

      - name: Build plugin
        shell: pwsh
        env:
          EFT_DIR: ${{ runner.temp }}\RaidReplay-SptRefs
        run: dotnet build src/RaidReplay.Plugin/RaidReplay.Plugin.csproj --configuration Release "-p:EftDir=$env:EFT_DIR" -p:SkipDeploy=true

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: RaidReplay
          path: src/RaidReplay.Plugin/bin/Release/netstandard2.1/RaidReplay.dll
          if-no-files-found: error
