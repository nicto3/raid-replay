name: Build RaidReplay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check .NET SDK
        shell: pwsh
        run: dotnet --info

      - name: Download SPT 4.1 compile references
        shell: pwsh
        run: |
          $managed = Join-Path $env:RUNNER_TEMP 'RaidReplay-SptRefs\EscapeFromTarkov_Data\Managed'
          New-Item -ItemType Directory -Force -Path $managed | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/Solarint/SAIN/4.1.0/References/hollowed.dll' -OutFile (Join-Path $managed 'Assembly-CSharp.dll')
          Invoke-WebRequest 'https://raw.githubusercontent.com/Solarint/SAIN/4.1.0/References/Comfort.dll' -OutFile (Join-Path $managed 'Comfort.dll')
          Invoke-WebRequest 'https://raw.githubusercontent.com/Solarint/SAIN/4.1.0/References/Sirenix.Serialization.dll' -OutFile (Join-Path $managed 'Sirenix.Serialization.dll')
          if ((Get-Item (Join-Path $managed 'Assembly-CSharp.dll')).Length -ne 7898624) { throw 'Unexpected Assembly-CSharp reference size' }
          if ((Get-Item (Join-Path $managed 'Comfort.dll')).Length -ne 30264) { throw 'Unexpected Comfort reference size' }
          if ((Get-Item (Join-Path $managed 'Sirenix.Serialization.dll')).Length -ne 114688) { throw 'Unexpected Sirenix.Serialization reference size' }

      - name: Build plugin
        shell: pwsh
        env:
          EFT_DIR: ${{ runner.temp }}\RaidReplay-SptRefs
        run: dotnet build src/RaidReplay.Plugin/RaidReplay.Plugin.csproj --configuration Release "-p:EftDir=$env:EFT_DIR" -p:SkipDeploy=true

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: RaidReplay
          path: src/RaidReplay.Plugin/bin/Release/netstandard2.1/RaidReplay.dll
          if-no-files-found: error
